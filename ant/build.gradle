import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'com.gradleup.shadow'
    id 'java'
    id 'maven-publish'
    id 'proguard.conventions'
}

dependencies {
    implementation project(':base')
    implementation(libs.ant)
}

def shadowJar = tasks.named('shadowJar', ShadowJar) {
    destinationDirectory.set(file("$rootDir/lib"))
    archiveFileName.set('proguard-ant.jar')
    manifest {
        attributes(
                'Multi-Release': true,
                'Implementation-Version': archiveVersion.get(),
        )
    }
}

configurations {
    jarDistribution {
        canBeConsumed = true
        canBeResolved = false
    }
}

artifacts {
    jarDistribution shadowJar
}

publishing {
    publications.named(project.name) {
        pom {
            description = 'Ant plugin for ProGuard, the free shrinker, optimizer, obfuscator, and preverifier for Java bytecode'
        }
    }
}
